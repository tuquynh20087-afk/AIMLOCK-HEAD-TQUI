<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AimLock Tqih</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #4b0000 0%, #1a0000 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: white;
        }

        h1 {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #ff3333;
            font-size: 20px;
            text-align: center;
            margin-bottom: 50px;
        }

        .option-card {
            width: 100%;
            max-width: 420px;
            background: rgba(80, 0, 0, 0.4);
            border: 2px solid rgba(255, 0, 0, 0.25);
            border-radius: 12px;
            padding: 22px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }

        .option-card.active {
            border-color: #ff4444;
            box-shadow: 0 0 18px rgba(255, 0, 0, 0.35);
            background: rgba(100, 0, 0, 0.5);
        }

        .icon-box {
            width: 48px;
            height: 48px;
            background: rgba(255, 0, 0, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .content {
            flex: 1;
        }

        .title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff2222, #ff6666);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .percent {
            text-align: right;
            font-size: 18px;
            color: #ff5555;
            font-weight: 600;
            margin-top: 4px;
        }

        .btn-confirm {
            width: 100%;
            max-width: 420px;
            background: #00cc44;
            border: none;
            border-radius: 12px;
            padding: 20px;
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-top: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0, 204, 68, 0.4);
        }

        .support-buttons {
            position: fixed;
            bottom: 30px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .support-btn {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .zalo {
            background: #0099ff;
        }

        .telegram {
            background: #0099ff;
        }
    </style>
</head>
<body>

    <h1>DESEJADO</h1>
    <p class="subtitle">Chọn vùng tác động ưu tiên</p>

    <!-- AIMLOCK -->
    <div class="option-card">
        <div class="icon-box">💀</div>
        <div class="content">
            <div class="title">AIMLOCK</div>
            <div class="bar-container">
                <div class="bar-fill" style="width: 100%;"></div>
            </div>
            <div class="percent">200% DMG</div>
        </div>
    </div>

    <!-- AIMLOCK V1 - ĐƯỢC CHỌN -->
    <div class="option-card active">
        <div class="icon-box">❤️</div>
        <div class="content">
            <div class="title">AIMLOCK V1</div>
            <div class="bar-container">
                <div class="bar-fill" style="width: 75%;"></div>
            </div>
            <div class="percent">150% DMG</div>
        </div>
    </div>

    <!-- AIMLOCK V2 -->
    <div class="option-card">
        <div class="icon-box">👤</div>
        <div class="content">
            <div class="title">AIMLOCK V2</div>
            <div class="bar-container">
                <div class="bar-fill" style="width: 50%;"></div>
            </div>
            <div class="percent">100% DMG</div>
        </div>
    </div>

    <!-- AIMLOCK SUPER -->
    <div class="option-card">
        <div class="icon-box">🏃</div>
        <div class="content">
            <div class="title">AIMLOCK SUPER</div>
            <div class="bar-container">
                <div class="bar-fill" style="width: 35%;"></div>
            </div>
            <div class="percent">70% DMG</div>
        </div>
    </div>

    <!-- TỰ ĐỘNG AI -->
    <div class="option-card">
        <div class="icon-box">🤖</div>
        <div class="content">
            <div class="title">Tự động (AI)</div>
            <div class="bar-container">
                <div class="bar-fill" style="width: 60%;"></div>
            </div>
            <div class="percent">120% DMG</div>
        </div>
    </div>

    <!-- NÚT XÁC NHẬN -->
    <button class="btn-confirm">
        🎯 ALVO XÁC NHẬN
    </button>

    <!-- NÚT HỖ TRỢ -->
    <div class="support-buttons">
        <button class="support-btn zalo">🤖 Hỗ trợ Zalo</button>
        <button class="support-btn telegram">✈️ Hỗ trợ Telegram</button>
    </div>

</body>
</html>
